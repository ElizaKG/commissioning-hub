<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commissioning Intelligence Hub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.1);
    --border-med: rgba(0,0,0,0.18);
    --text: #1a1a18;
    --text2: #5a5a54;
    --text3: #9a9a90;
    --green: #0f6e56;
    --green-light: #e1f5ee;
    --green-mid: #1d9e75;
    --green-text: #085041;
    --amber: #ba7517;
    --amber-light: #faeeda;
    --red: #a32d2d;
    --red-light: #fcebeb;
    --blue: #185fa5;
    --blue-light: #e6f1fb;
    --radius: 10px;
    --radius-sm: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --surface: #242422;
      --surface2: #2c2c2a;
      --border: rgba(255,255,255,0.1);
      --border-med: rgba(255,255,255,0.18);
      --text: #f0efe9;
      --text2: #a8a89e;
      --text3: #6a6a62;
      --green-light: #04342c;
      --green-text: #9fe1cb;
      --amber-light: #412402;
      --red-light: #501313;
      --blue-light: #042c53;
    }
  }

  body {
    font-family: 'Georgia', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  .app-shell {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 0 60px;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    background: var(--green);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: 'Georgia', serif;
    font-size: 15px;
    font-style: italic;
    letter-spacing: -0.5px;
  }

  .brand-text h1 {
    font-size: 14px;
    font-weight: normal;
    font-family: 'Georgia', serif;
    color: var(--text);
    letter-spacing: 0.01em;
  }

  .brand-text p {
    font-size: 11px;
    color: var(--text3);
    font-family: system-ui, sans-serif;
    letter-spacing: 0.03em;
  }

  .api-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text3);
    font-family: system-ui, sans-serif;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
  }

  .api-pill:hover { border-color: var(--border-med); }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text3);
  }

  .status-dot.live { background: var(--green-mid); }

  /* Nav tabs */
  .nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav::-webkit-scrollbar { display: none; }

  .nav-tab {
    padding: 11px 14px;
    font-size: 12px;
    font-family: system-ui, sans-serif;
    color: var(--text3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: color 0.15s;
    letter-spacing: 0.02em;
  }

  .nav-tab:hover { color: var(--text2); }
  .nav-tab.active { color: var(--green); border-bottom-color: var(--green-mid); }

  /* Content area */
  .content {
    padding: 20px;
  }

  /* Section label */
  .section-label {
    font-size: 10px;
    font-family: system-ui, sans-serif;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 10px;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }

  /* Quick launch grid — 3 buttons only */
  .launch-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }

  @media (max-width: 500px) {
    .launch-grid { grid-template-columns: 1fr; }
  }

  .launch-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
  }

  .launch-btn:hover {
    border-color: var(--green-mid);
    background: var(--green-light);
  }

  .launch-icon {
    font-size: 22px;
    color: var(--green-mid);
    display: block;
    margin-bottom: 8px;
  }

  .launch-title {
    font-size: 13px;
    font-weight: normal;
    font-family: 'Georgia', serif;
    color: var(--text);
    display: block;
    margin-bottom: 3px;
  }

  .launch-desc {
    font-size: 11px;
    font-family: system-ui, sans-serif;
    color: var(--text3);
    line-height: 1.4;
  }

  /* Info banner */
  .info-banner {
    background: var(--blue-light);
    border: 1px solid rgba(24,95,165,0.2);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 16px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .info-banner i { color: var(--blue); font-size: 16px; margin-top: 1px; flex-shrink: 0; }
  .info-banner p { font-size: 12px; font-family: system-ui, sans-serif; color: var(--blue); line-height: 1.5; }
  .info-banner a { text-decoration: underline; cursor: pointer; color: var(--blue); }

  /* Topic pills */
  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }

  .pill {
    font-size: 11px;
    font-family: system-ui, sans-serif;
    padding: 4px 11px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text2);
    cursor: pointer;
    background: var(--surface2);
    transition: all 0.15s;
  }

  .pill:hover { border-color: var(--green-mid); color: var(--green); background: var(--green-light); }
  .pill.active { border-color: var(--green-mid); color: var(--green-text); background: var(--green-light); }

  /* Input row */
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .input-row input, .input-row textarea {
    flex: 1;
    font-size: 13px;
    font-family: system-ui, sans-serif;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .input-row input:focus, .input-row textarea:focus { border-color: var(--green-mid); }

  textarea.tall {
    min-height: 90px;
    resize: vertical;
    line-height: 1.5;
  }

  /* Run button */
  .run-btn {
    background: var(--green);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 9px 18px;
    font-size: 13px;
    font-family: system-ui, sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background 0.15s;
  }

  .run-btn:hover { background: var(--green-text); }
  .run-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Result area */
  .result-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-top: 4px;
  }

  .result-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .result-bar-title {
    font-size: 12px;
    font-family: system-ui, sans-serif;
    font-weight: 600;
    color: var(--text2);
    letter-spacing: 0.02em;
  }

  .result-actions {
    display: flex;
    gap: 6px;
  }

  .icon-btn {
    font-size: 12px;
    font-family: system-ui, sans-serif;
    color: var(--text3);
    cursor: pointer;
    padding: 3px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 4px;
    transition: color 0.15s;
  }

  .icon-btn:hover { color: var(--text); border-color: var(--border-med); }

  .result-body {
    padding: 16px;
    font-size: 13px;
    font-family: system-ui, sans-serif;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    max-height: 520px;
    overflow-y: auto;
  }

  .loading-state {
    padding: 28px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    font-family: system-ui, sans-serif;
    color: var(--text3);
  }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--green-mid);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    padding: 36px 16px;
    text-align: center;
    font-size: 13px;
    font-family: system-ui, sans-serif;
    color: var(--text3);
  }

  .empty-state i { font-size: 28px; display: block; margin-bottom: 8px; }

  /* Persona grid */
  .persona-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }

  .persona-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }

  .persona-card:hover { border-color: var(--green-mid); }
  .persona-card.on { border-color: var(--green-mid); background: var(--green-light); }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    margin: 0 auto 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-family: system-ui, sans-serif;
    font-weight: 600;
  }

  .persona-name { font-size: 12px; font-family: system-ui, sans-serif; font-weight: 600; color: var(--text); }
  .persona-role { font-size: 10px; font-family: system-ui, sans-serif; color: var(--text3); margin-top: 1px; line-height: 1.3; }

  /* Settings rows */
  .settings-section { margin-bottom: 20px; }

  .settings-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
    gap: 16px;
  }

  .settings-row:last-child { border-bottom: none; }

  .settings-label {
    font-size: 13px;
    font-family: system-ui, sans-serif;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .settings-sub {
    font-size: 11px;
    font-family: system-ui, sans-serif;
    color: var(--text3);
    line-height: 1.4;
  }

  .settings-row input[type="text"],
  .settings-row input[type="password"] {
    font-size: 12px;
    font-family: system-ui, sans-serif;
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    width: 200px;
    outline: none;
  }

  .settings-row input:focus { border-color: var(--green-mid); }

  /* Tag list */
  .tag-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .tag {
    font-size: 11px;
    font-family: system-ui, sans-serif;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text2);
    background: var(--surface2);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .tag-remove {
    cursor: pointer;
    color: var(--text3);
    font-size: 10px;
    line-height: 1;
  }

  .tag-remove:hover { color: var(--red); }

  .tag-add {
    font-size: 11px;
    font-family: system-ui, sans-serif;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px dashed var(--border-med);
    color: var(--text3);
    cursor: pointer;
    background: transparent;
    transition: all 0.15s;
  }

  .tag-add:hover { border-color: var(--green-mid); color: var(--green); }

  /* Saved list */
  .saved-list { font-family: system-ui, sans-serif; }

  .saved-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .saved-item:last-child { border-bottom: none; }
  .saved-item:hover .saved-title { color: var(--green); }

  .saved-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
    transition: color 0.15s;
  }

  .saved-meta { font-size: 11px; color: var(--text3); }

  .saved-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--green-light);
    color: var(--green-text);
    white-space: nowrap;
    flex-shrink: 0;
    font-weight: 600;
  }

  .delete-btn {
    font-size: 11px;
    color: var(--text3);
    cursor: pointer;
    padding: 2px 6px;
  }

  .delete-btn:hover { color: var(--red); }

  /* Small util buttons */
  .util-btn {
    font-size: 11px;
    font-family: system-ui, sans-serif;
    color: var(--text3);
    cursor: pointer;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface2);
    transition: all 0.15s;
  }

  .util-btn:hover { color: var(--text); border-color: var(--border-med); }

  .btn-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="app-shell">

  <!-- Header -->
  <div class="header">
    <div class="header-brand">
      <div class="brand-mark">C</div>
      <div class="brand-text">
        <h1>Commissioning Intelligence Hub</h1>
        <p id="date-line">Loading...</p>
      </div>
    </div>
    <div class="api-pill" onclick="switchTab('settings')">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Settings</span>
    </div>
  </div>

  <!-- Nav -->
  <div class="nav">
    <div class="nav-tab active" id="tab-briefing" onclick="switchTab('briefing')"><i class="ti ti-sun-high"></i> Morning briefing</div>
    <div class="nav-tab" id="tab-policy" onclick="switchTab('policy')"><i class="ti ti-file-certificate"></i> Policy alerts</div>
    <div class="nav-tab" id="tab-horizon" onclick="switchTab('horizon')"><i class="ti ti-telescope"></i> Horizon scan</div>
    <div class="nav-tab" id="tab-funding" onclick="switchTab('funding')"><i class="ti ti-coin"></i> Funding tracker</div>
    <div class="nav-tab" id="tab-local" onclick="switchTab('local')"><i class="ti ti-map-pin"></i> Local radar</div>
    <div class="nav-tab" id="tab-events" onclick="switchTab('events')"><i class="ti ti-calendar-event"></i> Events & CPD</div>
    <div class="nav-tab" id="tab-saved" onclick="switchTab('saved')"><i class="ti ti-bookmark"></i> Saved</div>
    <div class="nav-tab" id="tab-settings" onclick="switchTab('settings')"><i class="ti ti-settings"></i> Settings</div>
  </div>

  <!-- Content -->
  <div class="content" id="main-content"></div>

</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────

const DEFAULT_FOCUS = [
  'Adult social care','NHS and ICS integration','Supported living',
  'Day opportunities','Residential and nursing care','Co-production',
  'Outcomes-based commissioning','Care Act','Social care workforce',
  'North Central London ICB','Haringey Council'
];

const DEFAULT_SOURCES = [
  'Kings Fund','Nuffield Trust','SCIE','LGA','ADASS',
  'DHSC','NHS England','CQC','PPL Consulting','Carnall Farrar',
  'Local Government Chronicle','Community Care','Health Service Journal'
];

let S = {
  apiKey: localStorage.getItem('cih_key') || '',
  tab: 'briefing',
  loading: false,
  result: null,
  resultTitle: '',
  saved: JSON.parse(localStorage.getItem('cih_saved') || '[]'),
  focus: JSON.parse(localStorage.getItem('cih_focus') || JSON.stringify(DEFAULT_FOCUS)),
  sources: JSON.parse(localStorage.getItem('cih_sources') || JSON.stringify(DEFAULT_SOURCES)),
  locality: localStorage.getItem('cih_locality') || 'Haringey, North London',
  personas: [],
  panelText: '',
  policyTopic: '',
  horizonTopic: '',
  fundingTopic: '',
};

function persist() {
  localStorage.setItem('cih_saved', JSON.stringify(S.saved));
  localStorage.setItem('cih_focus', JSON.stringify(S.focus));
  localStorage.setItem('cih_sources', JSON.stringify(S.sources));
  localStorage.setItem('cih_locality', S.locality);
}

function saveKey() { localStorage.setItem('cih_key', S.apiKey); }

// ─── Personas ─────────────────────────────────────────────────────────────────

const PERSONAS = [
  { id:'margaret', name:'Margaret', role:'Family member', init:'M', bg:'#F4C0D1', fg:'#72243E',
    desc:"Her mother is in a Haringey residential care home. Articulate, emotionally invested, distrustful of council bureaucracy, has been let down before. Asks: will this actually improve life for my mum?" },
  { id:'rajiv', name:'Rajiv', role:'Local journalist', init:'R', bg:'#B5D4F4', fg:'#0C447C',
    desc:"Haringey-based reporter. Looks for the political angle, wasted money, broken promises. Writes for readers who are residents and carers." },
  { id:'diane', name:'Diane', role:'Director of ACS', init:'D', bg:'#C0DD97', fg:'#27500A',
    desc:"Director of Adult Social Care. Experienced, politically astute, financially pressured. Supportive but demanding. Asks: is this deliverable, defensible, and will it survive scrutiny?" },
  { id:'priya', name:'Priya', role:'ICB Chief Officer', init:'P', bg:'#9FE1CB', fg:'#085041',
    desc:"NHS mindset, integration-focused, time-poor, wary of council bureaucracy. Asks: why should I prioritise this, and what's in it for the system?" },
  { id:'frank', name:'Frank', role:'Finance Director', init:'F', bg:'#FAC775', fg:'#633806',
    desc:"Has seen too many commissioning initiatives promise the earth and underdeliver. Asks: where's the evidence, what's the cost, and what's the exit if it doesn't work?" },
  { id:'joyce', name:'Joyce', role:'Frontline care worker', init:'J', bg:'#F5C4B3', fg:'#712B13',
    desc:"15 years in supported living. Practical, grounded, tired of strategies that don't understand the reality of the job. Asks: have you actually thought about how this works on the ground?" },
  { id:'tariq', name:'Tariq', role:'Provider CEO', init:'T', bg:'#CECBF6', fg:'#3C3489',
    desc:"Medium-sized social care provider. Commercial, relationship-focused. Asks: is this a genuine partnership or are you just passing risk to us?" }
];

// ─── Prompt builder ───────────────────────────────────────────────────────────

function buildPrompt(type, extra) {
  const focus = S.focus.join(', ');
  const sources = S.sources.join(', ');
  const loc = S.locality;
  const d = new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });

  const P = {

    briefing: `You are a commissioning intelligence assistant for a Senior Commissioner in Adult Social Care at ${loc}. Today is ${d}.

Search the web for today's most relevant news and developments. Produce a structured morning briefing with these sections:

1. TOP STORY — the single most important development for adult social care today, with your analysis of its commissioning implications
2. NATIONAL POLICY — DHSC, NHS England, DLUHC, Cabinet Office, or government announcements relevant to adult social care or health integration
3. NHS & INTEGRATION — ICS, ICB, and integrated care system developments, including any NCL-specific news
4. SECTOR INTELLIGENCE — new publications, commentary, or reports from: ${sources}
5. LOCAL RADAR — anything specific to ${loc}, Haringey, or North Central London
6. FUNDING & FINANCE — new funding streams, grants, financial guidance, or budget developments
7. ONE TO WATCH — an emerging issue not yet widely discussed but worth monitoring over the coming weeks

Focus areas to prioritise: ${focus}.

Be concise and analytical — I am a busy senior commissioner. After each item add one sentence: "Commissioning implication: [your analysis]". Flag anything marked ACTION REQUIRED if I need to respond to a consultation or deadline. Cite your sources with publication names and dates.`,

    policy: `You are a policy intelligence advisor for a Senior Commissioner in Adult Social Care at ${loc}. Today is ${d}.${extra ? `\n\nSpecific focus requested: ${extra}\n` : ''}

Search the web and produce a policy alert covering:

1. LIVE CONSULTATIONS — any open government, NHS, or regulatory consultations I should consider responding to, with closing dates
2. RECENT DECISIONS — policy announcements, statutory guidance, or circulars published in the last 14 days
3. UPCOMING REVIEWS — known upcoming spending reviews, white papers, independent reviews, or policy consultations launching soon
4. PARLIAMENTARY ACTIVITY — relevant House of Commons or Lords select committee inquiries, oral questions, or written answers in the last week
5. REGULATORY UPDATES — CQC inspection framework changes, new guidance, or enforcement notices relevant to adult social care
6. LEGAL DEVELOPMENTS — any case law, judicial reviews, or ombudsman decisions relevant to commissioning practice

For each item include: source, date, and one sentence on implications for a commissioner at ${loc}. Flag any items requiring a response or decision. Focus areas: ${focus}. Cite sources clearly.`,

    horizon: `You are a horizon scanning advisor for a Senior Commissioner in Adult Social Care at ${loc}. Today is ${d}.${extra ? `\n\nTopic: ${extra}\n` : ''}

Search the web and produce a horizon scan covering:

1. EMERGING COMMISSIONING PRACTICE — innovative approaches, new models, or emerging good practice from other councils, NHS bodies, or internationally

// ─── API call ─────────────────────────────────────────────────────────────────

async function runQuery(type, extra='') {
  if (!S.apiKey) { alert('Add your Claude API key in Settings first.'); return; }
  if (type === 'events') {
    const parts = [];
    if (S.eventThemes && S.eventThemes.length > 0) parts.push('Themes: ' + S.eventThemes.join(', '));
    if (S.eventFormat && S.eventFormat !== 'all') parts.push('Format: ' + S.eventFormat);
    if (S.eventCustom && S.eventCustom.trim()) parts.push(S.eventCustom.trim());
    extra = parts.join('. ');
  }
  if (type === 'panel') {
    if (S.personas.length === 0) { alert('Select at least one persona.'); return; }
    if (!S.panelText.trim()) { alert('Describe your proposal first.'); return; }
    extra = S.panelText;
  }

  S.loading = true; S.result = null; S.resultTitle = '';
  render();

  const titles = {
    briefing: 'Morning briefing — ' + fmtDate(new Date()),
    policy: 'Policy alert — ' + fmtDate(new Date()),
    horizon: 'Horizon scan — ' + fmtDate(new Date()),
    funding: 'Funding tracker — ' + fmtDate(new Date()),
    local: 'Local radar — ' + fmtDate(new Date()),
    events: 'Events and CPD — ' + fmtDate(new Date()),
    panel: 'Critical appraisal — ' + fmtDate(new Date())
  };

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': S.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content: buildPrompt(type, extra) }]
      })
    });
    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error('HTTP ' + resp.status + ': ' + (errData.error?.message || resp.statusText));
    }
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);
    const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
    S.result = text || 'No content returned. Try again.';
    S.resultTitle = titles[type] || type;
  } catch(e) {
    S.result = 'Error: ' + e.message + '\n\nThings to check:\n• API key is correct (Settings tab)\n• You have credits on your Anthropic account (console.anthropic.com)\n• Your account has access to claude-sonnet-4-20250514\n\nIf the error says 401, your API key is wrong or expired.\nIf it says 400, the model or tool name may have changed — open the file in a text editor and update the model string.';
    S.resultTitle = 'Error — tap to read';
  }

  S.loading = false;
  render();
}

// ─── Helpers ──────────────────────────────────────────────────────────────────

function fmtDate(d) {
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) +
    ' · ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateStatusBar() {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  if (!dot || !txt) return;
  if (S.apiKey) { dot.className = 'status-dot live'; txt.textContent = 'API ready'; }
  else { dot.className = 'status-dot'; txt.textContent = 'Add API key'; }
}

function saveCurrentResult() {
  if (!S.result) return;
  S.saved.unshift({ id: Date.now(), title: S.resultTitle, content: S.result, date: new Date().toISOString() });
  if (S.saved.length > 30) S.saved = S.saved.slice(0, 30);
  persist();
  alert('Saved to library.');
}

function copyCurrentResult() {
  if (!S.result) return;
  navigator.clipboard.writeText(S.result).then(() => alert('Copied to clipboard.')).catch(() => alert('Copy failed — try selecting and copying manually.'));
}

function deleteSaved(id) {
  S.saved = S.saved.filter(x => x.id !== id);
  persist(); render();
}

function viewSaved(id) {
  const item = S.saved.find(x => x.id === id);
  if (!item) return;
  S.result = item.content;
  S.resultTitle = item.title;
  S.tab = 'briefing';
  render();
}

// ─── Result renderer ──────────────────────────────────────────────────────────

function resultHtml() {
  if (S.loading) return `<div class="result-box"><div class="loading-state"><div class="spinner"></div><span>Searching the web and analysing — usually 20–40 seconds...</span></div></div>`;
  if (!S.result) return `<div class="result-box"><div class="empty-state"><i class="ti ti-news"></i>Your briefing will appear here</div></div>`;
  return `<div class="result-box">
    <div class="result-bar">
      <span class="result-bar-title">${esc(S.resultTitle)}</span>
      <div class="result-actions">
        <button class="icon-btn" onclick="copyCurrentResult()"><i class="ti ti-copy"></i> Copy</button>
        <button class="icon-btn" onclick="saveCurrentResult()"><i class="ti ti-bookmark"></i> Save</button>
      </div>
    </div>
    <div class="result-body">${esc(S.result)}</div>
  </div>`;
}

// ─── Settings actions ─────────────────────────────────────────────────────────

function removeFocus(i) { S.focus.splice(i,1); persist(); render(); }
function addFocus() {
  const t = prompt('Add focus area (e.g. "Residential care", "Mental health"):');
  if (t && t.trim()) { S.focus.push(t.trim()); persist(); render(); }
}
function resetFocus() { if (confirm('Reset to default focus areas?')) { S.focus = [...DEFAULT_FOCUS]; persist(); render(); } }

function removeSource(i) { S.sources.splice(i,1); persist(); render(); }
function addSource() {
  const t = prompt('Add source to monitor (e.g. "Social Care Institute for Excellence", "BMJ"):');
  if (t && t.trim()) { S.sources.push(t.trim()); persist(); render(); }
}
function resetSources() { if (confirm('Reset to default sources?')) { S.sources = [...DEFAULT_SOURCES]; persist(); render(); } }

function clearSaved() { if (confirm('Delete all saved briefings? This cannot be undone.')) { S.saved = []; persist(); render(); } }

// ─── Tab switching ────────────────────────────────────────────────────────────

function switchTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('tab-' + tab);
  if (el) el.classList.add('active');
  render();
}

// ─── Render ───────────────────────────────────────────────────────────────────

function render() {
  const mc = document.getElementById('main-content');
  if (!mc) return;
  const renderers = {
    briefing: renderBriefing,
    policy: renderPolicy,
    horizon: renderHorizon,
    funding: renderFunding,
    local: renderLocal,
    events: renderEvents,
    saved: renderSaved,
    settings: renderSettings
  };
  mc.innerHTML = (renderers[S.tab] || renderBriefing)();
  updateStatusBar();
  const dl = document.getElementById('date-line');
  if (dl) dl.textContent = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

render();
</script>
